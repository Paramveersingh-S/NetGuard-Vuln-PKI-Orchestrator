! ==========================================================================
! NetGuard Automated Cisco Hardening Baseline (Chandigarh-Offshore-SOC-Lab)
! Platforms: Cisco Catalyst 2960-X IOS + Cisco ASA 5516-X
! ==========================================================================
!
vlan 10
 name CORP_WORKSTATIONS
vlan 20
 name OFFSHORE_OT_ROV
vlan 99
 name MGMT_PAM_BOMGAR
vlan 999
 name BLACKHOLE_UNUSED
!
! --- Layer 2 Anti-Spoofing (DHCP Snooping + Dynamic ARP Inspection) ---
ip dhcp snooping
ip dhcp snooping vlan 10,20
no ip dhcp snooping information option
ip arp inspection vlan 10,20
ip arp inspection validate src-mac dst-mac ip
!
interface GigabitEthernet1/0/48
 description UPLINK-TO-CORE-AD-DHCP
 switchport mode trunk
 ip dhcp snooping trust
 ip arp inspection trust
!
! --- 802.1X NAC + Port Security ---
aaa new-model
dot1x system-auth-control
interface range GigabitEthernet1/0/1 - 24
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 ip dhcp snooping limit rate 15
 authentication port-control auto
 dot1x pae authenticator
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! --- Management Plane Hardening ---
ip ssh version 2
line vty 0 4
 transport input ssh
 access-class VTY-MGMT-ACL in
!
! --- Cisco ASA Firewall Policy (IT/OT Segmentation & BeyondTrust/Bomgar) ---
access-list CORP-TO-OT-IN extended deny tcp 10.20.0.0 255.255.0.0 any eq 445
access-list CORP-TO-OT-IN extended deny tcp 10.20.0.0 255.255.0.0 any eq 3389
access-list CORP-TO-OT-IN extended deny tcp 10.20.0.0 255.255.0.0 10.50.10.0 255.255.255.0 eq 23
access-list CORP-TO-OT-IN extended permit tcp 10.99.0.0 255.255.255.0 10.50.10.0 255.255.255.0 eq 22
access-list CORP-TO-OT-IN extended permit tcp 10.20.0.0 255.255.0.0 10.10.1.0 255.255.255.0 eq 636
access-list CORP-TO-OT-IN extended deny ip 10.20.0.0 255.255.0.0 10.50.10.0 255.255.255.0 log
!
access-list PAM-JUMP-OUT extended permit tcp 10.99.0.0 255.255.255.0 host 198.51.100.44 eq 443
access-list PAM-JUMP-OUT extended deny ip 10.99.0.0 255.255.255.0 any log
!
access-group CORP-TO-OT-IN in interface CORP_VLAN10
access-group PAM-JUMP-OUT in interface PAM_JUMP_VLAN99
!
end
